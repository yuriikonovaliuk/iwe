[package]
name = "iwec"
description = "IWE MCP server"
include = ["Cargo.toml", "src/**/*.rs", "tests/**/*.rs"]
autotests = false

version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "iwec"
path = "src/main.rs"

# Probe-only fixture for the [commit] trigger e2e tests (6-t1), sharing
# its single source file with the CLI crate's identical fixture (a [[bin]]
# of this package so `CARGO_BIN_EXE_iwe_commit_probe` is guaranteed
# available to this crate's integration tests).
[[bin]]
name = "iwe_commit_probe"
path = "../iwe/tests/support/iwe_commit_probe.rs"

[dependencies]
liwe.workspace = true
diwe.workspace = true
# The probe fixture is a [[bin]] of this package and as such links only
# regular dependencies, never dev-dependencies — so iwe-lock (which the
# probe's in-window observables call) must be listed here, not in
# [dev-dependencies]. The product binaries themselves do not use it
# directly.
iwe-lock.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }
tokio-util = "0.7"
axum = "0.8"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = "1.2"
minijinja.workspace = true
chrono.workspace = true
libc = "0.2"

[[test]]
name = "integration"
path = "tests/main.rs"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
liwe.workspace = true
diwe.workspace = true
indoc.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "test-util", "net", "time"] }
rmcp = { version = "3", features = ["server", "client", "macros", "transport-io", "transport-async-rw", "transport-child-process", "transport-streamable-http-client-reqwest", "schemars"] }
anyhow = "1"
