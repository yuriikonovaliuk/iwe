[package]
name = "liwe"
description = "IWE core library"
include = ["Cargo.toml", "src/**/*.rs", "src/**/*.json", "tests/**/*.rs", "tests/**/*.md"]
autotests = false

version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "liwe"
path = "src/lib.rs"

[features]
djot = ["dep:jotdown"]

[dependencies]
indoc.workspace = true
serde.workspace = true
itertools.workspace = true
log.workspace = true
rayon.workspace = true
regex.workspace = true
rand.workspace = true
rustc-hash.workspace = true
pulldown-cmark.workspace = true
pulldown-cmark-to-cmark.workspace = true
jotdown = { workspace = true, optional = true }
schematter-validator.workspace = true
serde_json.workspace = true
relative-path.workspace = true
chrono.workspace = true
sys-locale.workspace = true
serde_yaml.workspace = true
minijinja.workspace = true
sanitize-filename.workspace = true
percent-encoding.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
required-features = ["djot"]

# T9 (M2, knowledge-compositor): independent, contract-only tests for the
# body-as-property retrofit, written by Test-builder. Kept as its own test
# target (rather than folded into tests/main.rs) so it runs under plain
# `cargo test` without requiring the `djot` feature.
[[test]]
name = "body_property_addressing"
path = "tests/body_property_addressing_test.rs"

[dev-dependencies]
env_logger.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
