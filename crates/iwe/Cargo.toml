[package]
name = "iwe"
description = "IWE CLI utility"
include = ["Cargo.toml", "src/**/*.rs", "src/**/*.yaml", "tests/**/*.rs", "tests/**/*.md", "templates/**/*", "help/**/*", "docs/**/*"]
autotests = false
autobenches = false

version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "iwe"
path = "src/main.rs"

# Probe-only fixture for the [commit] trigger e2e tests (6-t1):
# a [[bin]] (not an example) so `CARGO_BIN_EXE_iwe_commit_probe` is
# guaranteed available to this crate's integration tests. Never part of
# any product surface; the iwe binary itself does not use it.
[[bin]]
name = "iwe_commit_probe"
path = "tests/support/iwe_commit_probe.rs"

[dependencies]
liwe.workspace = true
diwe.workspace = true
# The probe fixture is a [[bin]] of this package and as such links only
# regular dependencies, never dev-dependencies — so iwe-lock (which the
# probe's in-window observables call) must be listed here, not in
# [dev-dependencies]. The product binaries themselves do not use it
# directly.
iwe-lock.workspace = true
indoc.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
itertools.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
graphviz-rust.workspace = true
minijinja.workspace = true
csv.workspace = true
chrono.workspace = true
sys-locale.workspace = true
serde_yaml.workspace = true
sanitize-filename.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[[bench]]
name = "load"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "similarity"
harness = false

[dev-dependencies]
pretty_assertions.workspace = true
jsonschema.workspace = true
tempfile.workspace = true
uuid.workspace = true
criterion = { version = "0.7", features = ["html_reports"] }
